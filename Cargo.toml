[workspace]
resolver = "2"
members = [
    "crates/yogurt-cli",
    "crates/yogurt-server",
    "crates/yogurt-audio",
    "crates/yogurt-stt",
    "crates/yogurt-prompts",
    "crates/yogurt-notes",
    "crates/yogurt-llm",
    "crates/yogurt-db",
    "crates/yogurt-granola",
    "crates/yogurt-voice",
]

[workspace.package]
version = "4.2.1"
edition = "2021"
authors = ["Jarvis Chen <jarvisrchen@gmail.com>"]
license = "MIT"
repository = "https://github.com/jarvisrchen/yogurt-open"
rust-version = "1.96"
description = "Local-first meeting copilot - Granola's UX, your machine."
homepage = "https://yogurt-ai.dev"
documentation = "https://yogurt-ai.dev"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::audio"]
keywords = ["meeting", "transcription", "notes", "local-first", "granola"]

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8.5", features = ["mime-guess"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native roots trust the certificates in the macOS Keychain, such as a TLS-inspecting proxy's, beside the
# bundled webpki ones. Leave macos-system-configuration off: it ignores the System Settings bypass list,
# so it would send localhost calls (yogurt ctl, Ollama) to a corporate proxy. HTTPS_PROXY still works.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
ulid = { version = "1", features = ["serde"] }
# Gated behind `--dev` in yogurt-cli main(). Release builds never read .env.local.
dotenvy = "0.15"
directories = "5"
rand = "0.8"
base64 = "0.22"
subtle = "2"
assert_cmd = "2"
tempfile = "3"
# rustls avoids an OpenSSL link (single-binary distribution needs no system
# OpenSSL). Do NOT enable the default native-tls feature.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
cpal = "0.16"
# Pinned to 8 with macos_13_0 (audio capture surface); 0.3 had a different builder API.
screencapturekit = { version = "8", features = ["macos_13_0"] }
rubato = "0.16"
# Lock-free SPSC ring buffer that decouples real-time audio callbacks (cpal
# IOProc, SCK delegate) from the tokio drainer task that owns rubato.
rtrb = "0.3"
# Non-poisoning mutex around the SPSC producer in the SCK audio handler, whose
# trait bound demands `Fn + Send + Sync`.
parking_lot = "0.12"
thiserror = "2"
tinytemplate = "1.2"
pulldown-cmark = { version = "0.12", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
eventsource-stream = "0.2"
wiremock = "0.6"
# html-escape escapes user text before it is interpolated into wire-format
# spans. ammonia allowlist-sanitizes the final enriched_md so an LLM
# hallucinated <script> or <img onerror=...> never reaches the browser DOM.
html-escape = "0.2"
ammonia = "4"
# `default-features = false` lets yogurt-stt opt into Metal explicitly, so
# consumers without `local-stt` never pull in the whisper.cpp CMake build.
whisper-rs = { version = "0.16", default-features = false }
# llama.cpp builds as dylibs, each library keeping the ggml it ships with. Linked statically beside whisper.cpp's
# ggml, the two copies collide and llama.cpp aborts on its first call. The release ships the dylibs in libexec/.
# Pinned exactly, -sys crate included, so an upgrade is a deliberate change gated on tests/local_models.rs.
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["metal", "dynamic-link"] }
llama-cpp-sys-2 = "=0.1.161"
# Parakeet runs on sherpa-onnx's prebuilt shared libraries. Its static build runs int8 2 to 4 times slower.
# Pinned exactly, -sys crate included, because crates/yogurt-stt/build.rs pins the prebuilt archive's SHA-256 for this version.
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
sherpa-onnx-sys = { version = "=2.0.1", default-features = false, features = ["shared"] }
webrtc-vad = "0.4"
sha2 = "0.10"
# BSD-3-Clause.
ed25519-dalek = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
