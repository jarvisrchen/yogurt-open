[package]
name = "yogurt-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
yogurt-audio = { path = "../yogurt-audio", default-features = false }
# REST handlers call `yogurt_stt::models::*` and `meetings/start.rs` constructs
# `WhisperLocal`, so the local path is always on for the server.
yogurt-stt = { path = "../yogurt-stt", features = ["local-stt"] }
yogurt-llm = { path = "../yogurt-llm", default-features = false, features = ["local"] }
# `MockLlm::stream` returns a `BoxStream`, so this is a main dependency.
futures-util = { workspace = true }
yogurt-db = { path = "../yogurt-db", default-features = false }
yogurt-granola = { path = "../yogurt-granola" }
yogurt-voice = { path = "../yogurt-voice" }
uuid = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
yogurt-prompts = { path = "../yogurt-prompts" }
yogurt-notes = { path = "../yogurt-notes" }
html-escape = { workspace = true }
# Tempdir for the test_support module. Release builds never link it.
tempfile = { workspace = true, optional = true }

[features]
default = []
pro = []
# Exposes `test_support::{MockChunksLlm, run_with_mock_llm, seed_meeting}` to
# integration tests. Release builds never compile the helpers.
test-support = ["dep:tempfile"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
wiremock = { workspace = true }
yogurt-server = { path = ".", default-features = false, features = ["test-support"] }
